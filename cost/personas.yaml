# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số không có nguồn khảo sát được đánh dấu "(tự ước tính)".

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # Quy mô người dùng thử hàng tháng; chưa có số tiếp cận thực đo.
  low: 100
  base: 300
  high: 1000
  source: "(tự ước tính) 3 kịch bản tiếp cận người đi du lịch tự túc; chưa phải số người dùng thực tế."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5821
    uses_per_month: 0.125
    turns_per_session: 1
    source: "evidence/summary.md Câu 2: 39/67 người đã du lịch tự túc đi 1–2 lần/năm; 1,5/12 phiên/tháng và 1 lượt/phiên (tự ước tính)."
  - name: dung_vua
    share: 0.2985
    uses_per_month: 0.3333
    turns_per_session: 2
    source: "evidence/summary.md Câu 2: 20/67 đi 3–5 lần/năm; 4/12 phiên/tháng và 2 lượt/phiên (tự ước tính)."
  - name: dung_nhieu
    share: 0.1194
    uses_per_month: 0.5
    turns_per_session: 3
    source: "evidence/summary.md Câu 2: 8/67 đi >5 lần/năm; lấy cận 6/12 phiên/tháng và 3 lượt/phiên (tự ước tính)."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — 2 mức tham chiếu từ bảng giá repo đề, xem 25/11/2026.
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "E:/minihackathon/K5-L3-Day15-AI-Product-Hackathon/further-reading/model-prices.csv; https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
