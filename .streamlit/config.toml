# Theme web demo (web/streamlit_app.py) — Editorial Travel / Modern Clean. Chỉ `streamlit run` đọc file này.
[theme]
base = "light"
primaryColor = "#1B4D3E"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#F3EFE9"
textColor = "#1C1917"
borderColor = "#E7E2DA"
showWidgetBorder = true

[browser]
gatherUsageStats = false
